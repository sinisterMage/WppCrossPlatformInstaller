name: Build and Publish W++ Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'W++ version (e.g. 0.2.9)'
        required: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            zip: ingot-win-x64.zip
            output: IngotCLI.exe
            final: ingot.exe
          - os: ubuntu-latest
            zip: ingot-linux-x64.zip
            output: IngotCLI
            final: ingot-linux-x64
          - os: macos-latest
            zip: ingot-osx-x64.zip
            output: IngotCLI
            final: ingot

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout installer repo
        uses: actions/checkout@v4

      - name: Download CLI zip from WPlusPlus release
        run: |
          curl -L -o cli.zip https://github.com/sinisterMage/WPlusPlus/releases/download/v${{ github.event.inputs.version }}/${{ matrix.zip }}
          unzip cli.zip -d extracted

      - name: Copy and rename CLI binary into public/
        run: |
          mkdir -p public
          cp extracted/${{ matrix.output }} public/${{ matrix.final }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build installer for current platform
        run: npm run dist

      - name: Package installer into zip
        run: zip -r installer-${{ matrix.os }}.zip dist/

      - name: Upload installer to WPlusPlus release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          files: installer-${{ matrix.os }}.zip
          repository: sinisterMage/WPlusPlus
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.WPP_MAIN_PAT }}
